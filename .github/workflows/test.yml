name: Test Nintendo backend
on:
  push:
    branches: [main]
    paths: ['nintendo_backend/**', 'scripts/**', 'tests/**', 'data/chinese_names.json', 'requirements*.txt', '.github/workflows/test.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
